[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shariah-trading-agent"
version = "0.1.0"
description = "Shariah-screened, delivery-only, paper-first trading agent for NSE"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<3.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "yfinance>=0.2.40",
    "pyotp>=2.9.0",
    "growwapi>=1.5.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agent = "agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
